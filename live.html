<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GUMMELO SPECIAL LIVE</title>

  <link rel="stylesheet" href="css/live.css">
</head>

<body>

  <main class="site">

    <section class="hero">

      <div class="hero-glow"></div>

      <p class="event-date">9.3 GUMMY DAY</p>

      <h1 class="logo">GUMMELO</h1>

      <p class="logo-ja">グミメロ</p>

      <p class="special-live">SPECIAL LIVE</p>


      <div class="stage-card">

        <img
          src="image/gummelo.png"
          alt="GUMMELO SPECIAL LIVE ステージ"
          class="stage-image"
        >

        <div class="stage-overlay">

          <span class="now-playing-label">
            NOW PLAYING
          </span>

          <span class="track-mini-title">
            推しグミ！
          </span>

        </div>

      </div>


      <div class="music-info">

        <h2>推しグミ！</h2>

        <p>GUMMELO</p>

      </div>


      <div class="progress-area">

        <div
          class="progress-track"
          id="progressTrack"
        >
          <div
            class="progress-fill"
            id="progressFill"
          ></div>
        </div>


        <div class="time-row">

          <span id="currentTime">
            0:00
          </span>

          <span id="duration">
            3:29
          </span>

        </div>

      </div>


      <div class="controls">

        <button
          id="backButton"
          class="sub-control"
          type="button"
          aria-label="10秒戻る"
        >
          ↶10
        </button>


        <button
          id="playButton"
          class="play-button"
          type="button"
          aria-label="再生"
        >
          ▶
        </button>


        <button
          id="forwardButton"
          class="sub-control"
          type="button"
          aria-label="10秒進む"
        >
          10↷
        </button>

      </div>


      <p class="headphone-message">
        🎧 イヤホン推奨
      </p>


      <p class="message">
        推しグミと一緒に、<br>
        グミメロの曲を楽しもう！
      </p>


      <audio
        id="liveMusic"
        preload="metadata"
      >
        <source
          src="music/oshigumi.mp3"
          type="audio/mpeg"
        >
      </audio>

    </section>


    <section class="footer">

      <p>
        9.3 GUMMY DAY
      </p>

      <strong>
        GUMMELO
      </strong>

      <span>
        グミメロ
      </span>

    </section>

  </main>


  <script src="live.js"></script>

</body>
</html>
